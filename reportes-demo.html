<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gula · Reportes (prueba)</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f6f5f2;color:#222}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:18px}h1{letter-spacing:-2px;margin-bottom:0}small{color:#777}.card{background:white;border:1px solid #e6e4df;border-radius:16px;padding:16px;margin:14px 0}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,button{font:inherit;padding:11px;border:1px solid #ddd;border-radius:9px;width:100%}button{background:#222;color:white;cursor:pointer;border:0;margin-top:10px}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;border-bottom:1px solid #eee;text-align:left}td:last-child,th:last-child{text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f6f5f2;padding:12px;border-radius:12px}.stat strong{display:block;font-size:22px}.muted{color:#777;font-size:12px}.warn{background:#fff3d6;padding:12px;border-radius:10px;font-size:13px}</style></head><body><main><h1>GULA <small>REPORTES</small></h1><p class="warn">PROTOTIPO: datos ficticios guardados solo en esta página. No se conecta a Supabase ni modifica ventas reales.</p>
<section class="card"><label>Fecha de entrega</label><input type="date" id="fecha" value="2026-11-08"><div class="grid"><div><label>Estado</label><select id="estado"><option>Todos</option><option>Pagado</option><option>Abono</option><option>Pendiente</option></select></div><div><label>Vista</label><select id="vista"><option value="productos">Productos</option><option value="comandas">Comandas</option></select></div></div></section>
<section class="card"><h2>Resumen del día</h2><div class="grid" id="resumen"></div><h3>Dinero recibido por medio</h3><table id="medios"></table><h3>Detalle</h3><table id="detalle"></table><button id="csv">Exportar CSV para Excel</button></section>
<section class="card"><h2>Simular un abono</h2><p class="muted">Ejemplo: comanda 103, saldo inicial $9.000. Puedes registrar varios abonos de efectivo o TEF.</p><label>Monto recibido ($)</label><input id="monto" type="number" min="1" step="1" placeholder="Ej. 3000"><label>Medio de pago</label><select id="medio"><option>Efectivo</option><option>TEF</option></select><button id="agregar">Registrar abono de prueba</button><div id="movimientos"></div></section>
</main><script>
const orders=[{id:101,fecha:'2026-11-08',cliente:'Camila',items:[{name:'Gohan pollo apanado',qty:2,price:5000},{name:'Brownie',qty:1,price:1000}],payments:[{amount:11000,method:'TEF'}]},{id:102,fecha:'2026-11-08',cliente:'Cristian',items:[{name:'Churros clásicos',qty:2,price:4000}],payments:[{amount:8000,method:'Efectivo'}]},{id:103,fecha:'2026-11-08',cliente:'Valentina',items:[{name:'Empanada de pino',qty:3,price:3000}],payments:[]},{id:104,fecha:'2026-11-08',cliente:'Felipe',items:[{name:'Leche asada',qty:2,price:2500}],payments:[{amount:5000,method:'TEF'}]}];
const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('es-CL'),total=o=>o.items.reduce((s,i)=>s+i.qty*i.price,0),paid=o=>o.payments.reduce((s,p)=>s+p.amount,0),balance=o=>total(o)-paid(o),state=o=>balance(o)===0?'Pagado':paid(o)>0?'Abono':'Pendiente';
function visible(){return orders.filter(o=>o.fecha===$('fecha').value&&($('estado').value==='Todos'||state(o)===$('estado').value))}
function rows(){const v=visible();if($('vista').value==='comandas')return [['Comanda / cliente','Estado / recibido','Saldo'],...v.map(o=>['#'+o.id+' · '+o.cliente,state(o)+' · '+money(paid(o)),money(balance(o))])];const map=new Map();for(const o of v)for(const i of o.items){const r=map.get(i.name)||{qty:0,total:0};r.qty+=i.qty;r.total+=i.qty*i.price;map.set(i.name,r)}return [['Producto','Cantidad','Total'],...[...map].map(([k,v])=>[k,String(v.qty),money(v.total)])]}
function render(){const day=orders.filter(o=>o.fecha===$('fecha').value),sum=fn=>day.reduce((s,o)=>s+fn(o),0),stats=[['Total comandas',money(sum(total))],['Cantidad de pedidos',day.length],['Dinero recibido',money(sum(paid))],['Saldo pendiente',money(sum(balance))]];$('resumen').innerHTML=stats.map(([k,v])=>'<div class="stat"><span class="muted">'+k+'</span><strong>'+v+'</strong></div>').join('');const received=m=>day.reduce((s,o)=>s+o.payments.filter(p=>p.method===m).reduce((a,p)=>a+p.amount,0),0);$('medios').innerHTML='<tr><td>Efectivo</td><td>'+money(received('Efectivo'))+'</td></tr><tr><td>Transferencia (TEF)</td><td>'+money(received('TEF'))+'</td></tr>';const r=rows();$('detalle').innerHTML='<thead><tr>'+r[0].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+r.slice(1).map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody>';$('movimientos').innerHTML='<p class="muted">Comanda 103: recibido '+money(paid(orders[2]))+' · saldo '+money(balance(orders[2]))+'</p>'+orders[2].payments.map(p=>'<p>'+money(p.amount)+' · '+p.method+'</p>').join('')}
for(const id of ['fecha','estado','vista'])$(id).addEventListener('change',render);
$('agregar').onclick=()=>{const o=orders[2],amount=Number($('monto').value);if(!Number.isInteger(amount)||amount<1||amount>balance(o)){alert('Ingresa un monto entero entre $1 y '+money(balance(o)));return}o.payments.push({amount,method:$('medio').value});$('monto').value='';render()};
$('csv').onclick=()=>{const data=rows().map(row=>row.map(s=>'"'+String(s).replaceAll('"','""')+'"').join(';')).join('\r\n');const b=new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Gula-reporte-'+$('fecha').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></body></html>
